# 客户端应用配置
spring:
    application:
        name: app
    datasource:
        # 游戏交易库连接
        url: "jdbc:mysql://localhost:3306/game?allowPublicKeyRetrieval=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&rewriteBatchedStatements=true&useAffectedRows=true"
        # 用户名默认 root；数据库口令必须由环境变量 DB_PASSWORD 提供，未设置时服务无法启动
        username: "${DB_USERNAME:root}"
        password: "${DB_PASSWORD}"
        driver-class-name: com.mysql.cj.jdbc.Driver
    # 缓存：redis（默认，需要本机/远程有 Redis）；本机没装 Redis 时可改成 none，功能不受影响
    cache:
        type: ${CACHE_TYPE:redis}
    # Redis 连接：密码等敏感信息从环境变量注入，不要写进仓库
    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            # 用户名默认 root；Redis 口令必须由环境变量 REDIS_PASSWORD 提供，未设置时服务无法启动
            username: ${REDIS_USERNAME:root}
            password: ${REDIS_PASSWORD}
            database: ${REDIS_DATABASE:0}
            # 连接超时，Redis 挂了也不会把接口拖死（读取失败会自动降级为查库）
            timeout: 3000ms

# 客户端服务端口
server:
    port: 8080

# JWT 配置
jwt:
    # 签名密钥必须由环境变量 JWT_SECRET 提供，至少 32 字节（HS256），且 app 与 console 必须使用同一个值
    secret: "${JWT_SECRET}"
    # Token 过期时间（秒），默认 2 小时
    expire-seconds: 7200

# MyBatis-Plus 配置
mybatis-plus:
    type-aliases-package: com.game.common.trading.entity
    global-config:
        # 关闭启动 banner
        banner: false
        db-config:
            # 主键默认自增（实体上也用 @TableId 显式声明）
            id-type: auto
    configuration:
        # 下划线字段自动映射为驼峰属性（MyBatis-Plus 默认开启，这里显式声明）
        map-underscore-to-camel-case: true
        # SQL 日志走 SLF4J（默认 INFO 级别不输出），避免把 sys_user.password 这类字段打到控制台；
        # 需要排查 SQL 时，把 logging.level.com.game.common.*.mapper 设为 debug
        log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
