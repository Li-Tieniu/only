# 管理端应用配置
spring:
  application:
    name: console
  datasource:
    # 游戏交易库连接
    url: "jdbc:mysql://localhost:3306/game?allowPublicKeyRetrieval=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&rewriteBatchedStatements=true&useAffectedRows=true"
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

# 管理端服务端口
server:
  port: 8081

# MyBatis-Plus 配置
mybatis-plus:
  type-aliases-package: com.game.common.trading.entity
  global-config:
    # 关闭启动 banner
    banner: false
    db-config:
      # 主键默认自增（实体上也用 @TableId 显式声明）
      id-type: auto
  configuration:
    # 下划线字段自动映射为驼峰属性（MyBatis-Plus 默认开启，这里显式声明）
    map-underscore-to-camel-case: true
    # 开发环境打印 SQL
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
